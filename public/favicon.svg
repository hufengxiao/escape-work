<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#grad)" />
  
  <!-- Clock Circle -->
  <circle cx="50" cy="50" r="34" fill="#0f172a" stroke="#38bdf8" stroke-width="4" />
  
  <!-- Clock ticks -->
  <line x1="50" y1="20" x2="50" y2="25" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="80" y1="50" x2="75" y2="50" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="50" y1="80" x2="50" y2="75" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="50" x2="25" y2="50" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />

  <!-- Hands at 18:00 (Straight down) -->
  <line x1="50" y1="50" x2="50" y2="28" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="50" y1="50" x2="50" y2="68" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" />
  <circle cx="50" cy="50" r="5" fill="#f8fafc" />

  <!-- Sneaking figure / running icon badge in corner -->
  <g transform="translate(62, 60) scale(0.65)">
    <circle cx="20" cy="10" r="8" fill="#fbbf24" />
    <path d="M12 22 L24 22 L30 36 M18 36 L12 46 M24 28 L34 30" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
